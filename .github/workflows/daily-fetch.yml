name: Daily Data Fetch

# 跟本機 Windows 工作排程器(scripts/setup_scheduled_task.ps1)平行運作的雲端版本：
# 同一套 scripts/fetch_daily.py，改在 GitHub Actions 上跑，抓完後把 data/ 目錄
# (SQLite DB + 原始 JSON 備份 + 執行紀錄) commit 回 repo，讓資料就算本機電腦沒開機
# 也能持續更新。抓完資料後順便跑 scripts/export_static.py 重新產生 docs/ 靜態展示版
# (GitHub Pages 設定成從 main branch 的 /docs 發布的話，網站內容就會跟著每天更新)。
#
# 注意：本機排程跟這個 workflow 都會各自寫入/推送 data/etf.db，兩邊沒有自動同步，
# 本機 git pull 時如果跟未推送的本機變更衝突，SQLite 是二進位檔沒辦法 merge，
# 需要手動挑一邊、接受會蓋掉另一邊當下沒推送的資料——這是已知取捨，不是 bug。

on:
  schedule:
    # 20:00 台北時間(UTC+8) = 12:00 UTC，對應本機排程的週一~週五 20:00。故意不排在
    # 整點(:00)：GitHub 官方文件明講 schedule event 在「每小時整點附近」最容易因為
    # 排隊塞車而延遲，往後錯開3分鐘。
    # 注意：GitHub 的 cron 只是「盡力而為」，不保證準時。實測(2026-09) 原本排在
    # 17:05 的排程一直是 13:30~14:15 UTC 才實際啟動(晚 4~5 小時)，且 9/15、9/21 整天
    # 沒觸發，這是 GitHub 端排隊延遲，不是 cron 寫法的問題；需要當天一定要更新時可
    # 到 Actions 頁面手動按 Run workflow (workflow_dispatch)。
    - cron: "3 12 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily fetch (ETF + TXO + 期貨 + 債市 + MPT + CPI + 總經 + ACM + 標售)
        run: python scripts/fetch_daily.py

      - name: Regenerate GitHub Pages 靜態展示版 (docs/)
        # 這步驟失敗不該連累 data/ 的抓取結果沒被 commit——跟 fetch_daily.py 裡
        # 每個資料源各自 try/except、互不連坐是同一個精神。continue-on-error 讓
        # 即使這步驟掛掉，下一步還是會把 data/ 的更新 push 上去。
        # 但「不連累」不等於「靜默」：這個步驟的失敗會被記錄在 steps.export.outcome，
        # 最後一步會在 push 完成之後讓整個 run 變紅。2026-10-21 起債市/Macros/Bond Auction
        # 的靜態資料整批沒產生，卻因為這裡的 continue-on-error 一路顯示成功、超過一個月沒人發現。
        id: export
        continue-on-error: true
        run: python scripts/export_static.py

      - name: Check etf.db size (GitHub 單檔上限 100MiB)
        # 單檔超過 100MiB(104,857,600 bytes) 時 git push 會被 GitHub 直接拒絕，而且是在最後
        # 一步才失敗(抓取/匯出都成功)。這步驟超過 85MB 先警告，只有「確定 push 一定會被拒絕」
        # (>= 104,000,000 bytes) 才中止。門檻不能設得比真正的上限低太多：上一版設在
        # 100,000,000(比上限低 4.8MB)，資料庫一超過就把整個排程擋下來、連正常資料都推不上去。
        run: |
          size=$(stat -c%s data/etf.db)
          echo "data/etf.db = $((size / 1024 / 1024)) MiB ($size bytes)"
          if [ "$size" -ge 104000000 ]; then
            echo "::error::data/etf.db 已逼近 GitHub 單檔 100MiB 上限，push 會被拒絕。需要精簡資料，見 README「etf.db 檔案大小」。"
            exit 1
          elif [ "$size" -gt 85000000 ]; then
            echo "::warning::data/etf.db 已超過 85MB，接近 GitHub 單檔 100MiB 上限，請盡快處理，見 README「etf.db 檔案大小」。"
          fi

      - name: Commit and push data + static site updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Automated data update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Fail the run if the static export had errors
        # 資料已經 push 上去了；這步驟只是讓 Actions 頁面看得到紅叉。失敗端點清單在上面
        # 「Regenerate GitHub Pages」步驟的日誌最後面。
        if: steps.export.outcome == 'failure'
        run: |
          echo "::error::靜態站台匯出有端點失敗 (資料已 push，但部分頁面可能沿用舊資料或缺檔)，請看「Regenerate GitHub Pages」步驟的日誌。"
          exit 1
