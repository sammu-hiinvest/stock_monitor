name: Daily Data Fetch

# 跟本機 Windows 工作排程器(scripts/setup_scheduled_task.ps1)平行運作的雲端版本：
# 同一套 scripts/fetch_daily.py，改在 GitHub Actions 上跑，抓完後把 data/ 目錄
# (SQLite DB + 原始 JSON 備份 + 執行紀錄) commit 回 repo，讓資料就算本機電腦沒開機
# 也能持續更新。
#
# 注意：本機排程跟這個 workflow 都會各自寫入/推送 data/etf.db，兩邊沒有自動同步，
# 本機 git pull 時如果跟未推送的本機變更衝突，SQLite 是二進位檔沒辦法 merge，
# 需要手動挑一邊、接受會蓋掉另一邊當下沒推送的資料——這是已知取捨，不是 bug。

on:
  schedule:
    # 17:00 台北時間(UTC+8) = 09:00 UTC，對應本機排程的週一~週五 17:00
    - cron: "0 9 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily fetch (ETF + TXO + 期貨 + 債市 + MPT + CPI + 總經 + ACM + 標售)
        run: python scripts/fetch_daily.py

      - name: Commit and push data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Automated data update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
